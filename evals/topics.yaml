topics:
  - id: T1
    name: BM25
    reader: B
    purpose: 理解原理
    depth: 标准
    prompt: 使用 woYao 研究 BM25。我会写后端代码，但没做过搜索。想理解原理，标准深度，只要 Markdown。
    questions:
      - q: 一个查询词在文档里出现 10 次，它的得分贡献是出现 1 次时的 10 倍吗？为什么？
        key: [不是 10 倍，增长逐渐变慢（饱和）, 单个词的贡献有上限，由 k1 控制, 这样设计是为了防止靠堆砌关键词刷分]
      - q: 两篇文档里某个查询词都出现 2 次，一篇很短、一篇很长，谁的得分更高？参数 b 在这里起什么作用？
        key: [短文档得分更高（b>0 时）, 长度与语料平均长度相比，越长折扣越大, b 控制长度归一化的强度，b=0 时不考虑长度]
      - q: 为什么"系统""的"这类词即使命中，对得分的贡献也很小？
        key: [这类词在很多文档里都出现，文档频率高, IDF 低，区分能力弱]
      - q: 你想找的文档根本不在结果列表里。调大或调小 k1、b 能解决吗？应该先查什么？
        key: [不能，参数只影响已命中文档之间的排序, 先查分词/分析器的结果, 再查查询条件（如 AND/OR）和召回]
      - q: 做混合检索时，为什么不能直接把 BM25 分数和向量余弦相似度相加？可以怎么做？
        key: [两种分数的尺度和分布不同，不能直接比较, 可以按名次融合（如 RRF）或先做归一化]

  - id: T2
    name: 最小 ReAct Agent 循环
    reader: B
    purpose: 动手实现
    depth: 标准
    prompt: 使用 woYao 带我用 Python 和 OpenAI 兼容接口实现一个最小的、能调用工具的 Agent 循环。我会写 Python，没写过 Agent。标准深度，只要 Markdown。
    questions:
      - q: 一轮带工具调用的交互中，消息列表依次追加了哪几类消息？
        key: [user 消息, 含 tool_calls 的 assistant 消息, 每个 tool_call 对应一条 tool 消息（带 tool_call_id）, 然后再次请求模型]
      - q: tool_calls 里的 arguments 是什么类型？执行工具前要做什么处理？
        key: [是 JSON 字符串, 需要解析（json.loads）, 需要处理解析失败或参数不合法的情况]
      - q: 循环在什么条件下结束？为什么还要设置最大轮数？
        key: [模型返回的消息不含 tool_calls 时结束, 设置最大轮数是为了防止无限循环和成本失控]
      - q: 工具执行出错时，为什么应该把错误信息作为工具结果返回给模型，而不是直接抛异常退出？
        key: [可恢复的参数或工具错误可供模型修正；权限或不可恢复错误应停止或升级, 直接退出会中断整个任务]
      - q: 要新增一个"读文件"工具，需要改哪几处？
        key: [实现工具函数, 在工具 schema 中声明名称、描述和参数, 在分发表/映射中注册]

  - id: T3
    name: Agent 工作流的持久化执行与崩溃恢复
    reader: B
    purpose: 理解原理
    depth: 完整
    prompt: 使用 woYao 研究 Agent 工作流的持久化执行（checkpoint）和崩溃恢复，可以参考 LangGraph、Temporal 等实现。我会写后端代码。完整深度，只要 Markdown。
    questions:
      - q: checkpoint 至少要保存哪些信息，才能从中断的地方继续执行？
        key: [当前的状态数据, 执行进度（已完成到哪一步、下一步做什么）, 用来定位这次执行的标识（如线程/运行 id）]
      - q: 进程在"工具已经调用成功、checkpoint 还没写入"的时候崩溃，恢复后会发生什么？
        key: [从上一个 checkpoint 恢复, 如果恢复机制重试未完成步骤，这一步可能重新执行, 外部动作可能重复，须幂等或核验]
      - q: 为什么说 checkpoint 本身不能保证外部副作用"恰好执行一次"？
        key: [外部调用和写 checkpoint 不是同一个原子操作, 两者之间可能崩溃, checkpoint 单独不保证恰好一次；至少一次还要求可靠重试和最终恢复]
      - q: 为"发起付款"这样的步骤设计一个防止重复执行的方案。
        key: [使用幂等键（由运行 id 和步骤确定，重试时复用）, 由服务端按幂等键去重, 或在恢复时先查询外部状态，确认是否已执行]
      - q: 什么时候应该把一个大步骤拆成多个小步骤，分别做 checkpoint？代价是什么？
        key: [步骤包含多个昂贵或有副作用的操作时拆分, 拆分后崩溃时需要重做的范围更小, 代价是写入次数和存储增加、状态设计更复杂]

  - id: T4
    name: 大模型推理中的 KV cache
    reader: A
    purpose: 理解原理
    depth: 标准
    prompt: 使用 woYao 研究大模型推理里的 KV cache。我是产品经理，不写代码，希望能和工程师讨论显存和成本问题。标准深度，只要 Markdown。
    questions:
      - q: 模型每生成一个新的字（token），为什么都要"回看"前面所有的内容？
        key: [模型通过注意力机制决定下一个 token, 在普通因果全注意力模型中，当前 query 和可见前文的 key 计算关联；滑动窗口等结构例外]
      - q: 如果不用 KV cache，会多做什么重复工作？
        key: [每生成一个 token，都要重新计算前面所有 token 的中间结果（K、V）, 文本越长，重复计算越多]
      - q: KV cache 存的是什么？为什么不需要缓存 Q？
        key: [存的是已处理 token 在每一层的 K 和 V, Q 只在计算当前这个新 token 时用一次，之后不再需要]
      - q: KV cache 占用的显存随什么增长？
        key: [随上下文长度（token 数）大致线性增长, 随同时服务的请求数增长, 和模型的层数、规模有关]
      - q: 同一张显卡，为什么对话越长、同时在线的人越多，就越容易显存不够？有哪些缓解思路？
        key: [KV cache 总量 ≈ 每个请求的长度 × 请求数，会把显存占满, 至少说出两种缓解办法：减少 KV 头数（GQA/MQA）、KV 量化、分页管理（PagedAttention）、限制上下文长度或使用滑动窗口]

  - id: T5
    name: OAuth 2.0 PKCE
    reader: A
    purpose: 理解原理
    depth: 标准
    prompt: 使用 woYao 研究 OAuth 2.0 的 PKCE。我不写代码，是做产品的，想理解它防的是什么。标准深度，只要 Markdown。
    questions:
      - q: 为什么手机 App 或网页前端不能像服务器那样保管 client_secret？
        key: [代码运行在用户的设备上，可以被反编译或直接查看, 这类应用属于公开客户端，无法保密]
      - q: 如果授权码被别的 App 截获，而且没有使用 PKCE，会发生什么？
        key: [攻击者可以用授权码去换取 access token, 从而冒用用户的授权]
      - q: PKCE 是怎样让"截获授权码"变得没用的？
        key: [发起授权时，客户端先生成随机的 code_verifier，只发送由它派生的 code_challenge, 用授权码换 token 时必须提交 code_verifier，由服务器校验, 攻击者只有授权码，没有 code_verifier]
      - q: 为什么推荐 S256 方式，而不是 plain？
        key: [S256 发送的是 verifier 的哈希，即使授权请求被截获也推算不出 verifier, plain 方式下 challenge 就是 verifier 本身，截获请求就等于泄露]
      - q: PKCE 防不住哪些问题？
        key: [它只保护"用授权码换 token"这一步, 防不住 token 发放后被窃取（例如 XSS）, 防不住钓鱼的假授权页或设备已被控制]

  - id: T6
    name: 千万级向量检索选型：pgvector 还是专用向量数据库
    reader: B
    purpose: 选型判断
    depth: 标准
    prompt: 使用 woYao 帮我做选型：我们有约 2000 万条 768 维向量，已经在用 PostgreSQL，查询经常带租户和时间过滤。该用 pgvector 还是 Milvus 这类专用向量数据库？标准深度，只要 Markdown。
    questions:
      - q: 决定这个选型的关键需求维度有哪些？
        key: [至少说出 4 个：数据量和增长、QPS 和延迟、过滤需求、写入/更新频率、团队运维能力、与现有 PG 数据的事务一致性和 join 需求]
      - q: HNSW 和 IVF 两类索引的主要取舍是什么？
        key: [以 pgvector v0.8.1 为例，HNSW 的速度与召回取舍通常更好，但内存较大、构建较慢；实际需测量, IVF 内存占用更低，需要先聚类训练，召回率依赖探查的分区数（nprobe/lists）]
      - q: 查询带严格过滤条件时，近似向量检索可能出现什么问题？
        key: [先做向量检索再过滤，会导致结果数量不够或召回率下降, 需要支持过滤的检索方式（预过滤、迭代扫描、过滤感知索引等）]
      - q: 在什么条件下 pgvector 就足够用？
        key: [规模和 QPS 在单机 PG 能承受的范围内, 需要事务一致性或和业务表 join, 团队不想额外运维一套系统]
      - q: 怎样用实验验证你的选择？
        key: [用自己的真实数据和查询, 以精确（暴力）检索的结果为基准测 recall@k, 测 p95/p99 延迟，并覆盖带过滤的场景和有并发写入的场景]
